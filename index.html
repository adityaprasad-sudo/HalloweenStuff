<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Halloween</title>
    <style>
     body{
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        perspective: 1010px;
        align-items: flex-end;
        justify-content: center;
        display: flex;
        background-color: #000000;
        
     }
     .bg{
        position: fixed;
        inset: -8%;
        width: 116%;
        height: 116%;
        background-image: url("assests/bakcgroundforest.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: brightness(0.75);
        z-index: 0;
        transition: transform 0.5s ease-out, filter 0.3s ease;
        filter: 0.3s ease;
     }
     body.horror-mode .bg{
        filter: brightness(0.35) contrast(1.25) hue-rotate(-10deg);
     }
     .scene{
        position: relative;
        width: min(92vw, 1280px);
        height: min(92vh, 920px);
        transform-style: preserve-3d;
        transition:transform 0.1s ease-out;
        will-change: transform;
        z-index: 2;
     }
     .bush{
        position: absolute;
        bottom: 0px;
        left: 50%;
        width: 115%;
        height: 130px;
        object-fit: fill;
        transform: translateX(-50%) translateZ(95px);
        filter: brightness(0.25) drop-shadow(0 -8px 15px rgba(0,0,0,0.9));
        pointer-events: none;
     }
     .insidethingy{
           position: absolute;
           bottom: 0;
           left: 50%;
           width:76%;
           height: 60%;
           transform: translateX(-50%) translateZ(-45px);
           overflow: hidden;
           background: #000;
           box-shadow: 0 20px 50px rgba(0,0,0,0.95);
     }
     .roombg{
        position: absolute;
        inset: -15.5%;
        width: 124%;
        height: 124%;
        object-fit: cover;
        object-position: center;
        transition: transform 0.1s ease-out, filter 0.2s ease;
        will-change: transform;
     }
     .happyguy{
      position: absolute;
      width: 65px;
      left: 44%;
      top: 48%;
      opacity: 0;
      mix-blend-mode: multiply;
      filter: contrast(1.5) drop-shadow(0 0 12px rgba(255, 0, 0, 0.6));
      transition: opacity 0.2s ease, transform 0.3s ease;
      pointer-events: none;
     }
     body.horrorshit .happyguy{
        opacity: 0.85;
        transform: scale(1.15);
     }
     .bulb{
        position: absolute;
        top: 8%;
        left: 15%;
        width: 70px;
        transform: translateX(-50%);
        filter: drop-shadow(0 0 18px rgba(255, 230, 90, 0.9));
        transition: filter 0.3s ease;
        z-index:10; 
     }
     body.horrorshit .blub{
        filter: drop-shadow(0 0 18px rgba(255, 40, 0, 0.4)) brightness(0.9);

     }
     .housewalls{
         position: absolute;
         bottom: 0;
         left: 50%;
         width: 78%;
         height: 56%;
         object-fit: fill;
         transform: translateX(-50%) translateZ(10px);
         filter:drop-shadow(0 12px 22px rgba(0,0,0,0.9));
         pointer-events: none;
     }
     .housewallthick{
         position: absolute;
         bottom: 0;
         left: 50%;
         width: 78%;
         height: 56%;
         object-fit: fill;
         transform: translateX(-50%) translateZ(10px);
         filter:brightness(0.3);
         pointer-events: none;
     }
     .houseroof{
         position: absolute;
         bottom:54.5%;
         left: 50%;
         width: 100%;
         height: 46%;
         z-index: 10;
         object-fit: fill;
         transform: translateX(-50%) translateZ(45px);
         filter:drop-shadow(0 12px 22px rgba(0,0,0,0.9));
         pointer-events: none;}
     .levercont{
        position: absolute;
        top:38%;
        right: 63%;
        transform: translateZ(65px);
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 0;
     }
     .levercont:hover{
        transform: translateZ(70px) translateY(6px);
     }
     .levercont:active{
        transform: translateZ(70px) translateY(30px);
     }
     .leverimg{
        width: 36px;
        height: 170px;
        object-fit: contain;
        filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.9));
     }
     @keyframes flicker {
      0%, 100% { filter: brightness(1); }
      20% { filter: brightness(0.1); }
      40% { filter: brightness(1.3); }
      60% { filter: brightness(0.05); }
      80% { filter: brightness(0.8); }
    }
    .flickering {
      animation: flicker 0.45s ease-in-out;
    }

    </style>
  </head>
  <body>
    <div class="bg" id="forestBg"></div>
    <div class="scene" id="scene">
    <div class="insidethingy">
      <img src="assests/bg.png" id="roomimg" class="roombg"/>
      <img src="assests/happyguy.png" class="happyguy"/>
      <img src="assests/blub.png" id="bulbimg" class="bulb"/>
    </div>
    <img src="assests/house.png" class="housewallthick"/>
    <img src="assests/house.png" class="housewalls"/>
    <img src="assests/roof.png" class="houseroof"/>
    <div class="levercont" id="lever">
      <img src="assests/lever.png" class="leverimg"/>
    </div>
    <img src="assests/Untitled.png" class="bush"/>
    </div>
    <script>
        const scene = document.getElementById('scene')
        const forestBg = document.getElementById('forestBg')
        const roomimg = document.getElementById('roomimg')
        const bulbimg = document.getElementById('bulbimg')
        const lever = document.getElementById('lever')
        const happyguy = document.querySelector('.happyguy')
       let shiton =false;
       window.addEventListener('mousemove', (e) =>{
        const x = e.clientX / window.innerWidth - 0.5
        const y = e.clientY / window.innerHeight - 0.5
        scene.style.transform = `rotateX(${y * 15}deg) rotateY(${x * 15}deg)`
        forestBg.style.transform = `rotateX(${y * 15}deg) rotateY(${x * 15}deg)`
        roomimg.style.transform = `rotateX(${y * 15}deg) rotateY(${x * 15}deg)`
       })
       lever.addEventListener('click', () =>{
        shiton = !shiton
        lever.classList.add('puller')
        setTimeout(() => 
            lever.classList.remove('puller'), 250
        )
        roomimg.classList.remove('flickering')
        void roomimg.offsetWidth
        roomimg.classList.add('flickering')
        setTimeout(() => {
            document.body.classList.toggle('horror-mode', shiton)
            roomimg.src = shiton ? 'assests/bgdark2.png' : 'assests/bg.png'
            bulbimg.src = shiton ? 'assests/blubdark.png' : 'assests/blub.png'
            happyguy.src = shiton ? 'assests/ee.png' : 'assests/happyguy.png'
        }, 180)
       })
    </script>
    
  </body>
</html>
